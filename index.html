<main id="app">

    <!-- Màn hình chính: sẽ được mở sau khi xác thực -->
    <section id="gameScreen" class="game-screen" aria-hidden="true">
        <h1>Cờ Tướng Online</h1>
    </section>

    <!-- Popup KEYLOGIN -->
    <div
        id="loginOverlay"
        class="login-overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="loginTitle"
    >
        <div class="login-popup">

            <h1 id="loginTitle">Cờ Tướng Online</h1>

            <p class="login-notice">
                Cần KEYLOGIN? Vui lòng liên hệ
                <span id="contactInfo">...</span>
            </p>

            <label for="loginKey">KEYLOGIN</label>

            <input
                id="loginKey"
                type="password"
                autocomplete="off"
                placeholder="Nhập KEYLOGIN"
                maxlength="128"
            >

            <button id="loginButton" type="button">
                XÁC NHẬN
            </button>

            <p
                id="loginMessage"
                class="login-message"
                aria-live="polite"
            ></p>

        </div>
    </div>

</main>
<script src="js/app.js"></script>
